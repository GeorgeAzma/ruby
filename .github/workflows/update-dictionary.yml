# Keeps the JMdict data current, as its licence requires.
#
# Monthly: rebuilds dict/jmdict.json from the latest JMdict and commits it. (GitHub disables scheduled
# workflows in public repositories after 60 days without activity, so a quarterly-only run would
# switch itself off.)
# Every three months (and when run by hand from the Actions tab), also raises the version, builds
# ruby.zip, and then either:
#   - with the CWS_* secrets set (see README.md), publishes the update to the Chrome Web Store, or
#   - without them, attaches ruby.zip to a GitHub release and opens an issue that notifies you,
#     so you only have to upload the file in the developer dashboard.
name: Update dictionary

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      AUTO_PUBLISH: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild dictionary
        run: node tools/build-dict.js

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet dict/jmdict.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          # Store releases in January, April, July and October, or whenever run by hand
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ " 01 04 07 10 " == *" $(date -u +%m) "* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Raise version
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.release == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("manifest.json", "utf8")
              .replace(/"version": "(\d+)\.(\d+)\.(\d+)"/, (m, a, b, c) => `"version": "${a}.${b}.${Number(c) + 1}"`);
            fs.writeFileSync("manifest.json", s);
            console.log(JSON.parse(s).version);
          '

      - name: Commit
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "VERSION=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update JMdict dictionary data"
          git push

      - name: Build package
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.release == 'true'
        run: zip -r -q ruby.zip manifest.json src lib dict icons THIRD_PARTY_NOTICES.md

      - name: Publish to the Chrome Web Store
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.release == 'true' && env.AUTO_PUBLISH == 'true'
        run: node tools/publish.js ruby.zip
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}

      - name: Prepare manual upload
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.release == 'true' && env.AUTO_PUBLISH != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" ruby.zip --title "v$VERSION: dictionary update" \
            --notes "Updated JMdict data. Upload ruby.zip in the Chrome Web Store developer dashboard (Package > Upload new package), then submit it for review."
          gh issue create --title "Upload v$VERSION to the Chrome Web Store" \
            --body "@${{ github.repository_owner }} The dictionary was updated. Download ruby.zip from the [v$VERSION release](${{ github.server_url }}/${{ github.repository }}/releases/tag/v$VERSION), upload it in the Chrome Web Store developer dashboard (Package > Upload new package), submit it for review, then close this issue."
