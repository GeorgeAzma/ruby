<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ruby</title>
<link rel="stylesheet" href="content.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: #ffffff;
    --label: #1c1c1e;
    --secondary: rgba(60, 60, 67, 0.6);
    --separator: rgba(60, 60, 67, 0.12);
    --fill: rgba(118, 118, 128, 0.12);
    --fill-strong: rgba(120, 120, 128, 0.2);
    --thumb: #ffffff;
    --accent: #de2c5f;
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --label: #ffffff;
      --secondary: rgba(235, 235, 245, 0.6);
      --separator: rgba(84, 84, 88, 0.6);
      --fill: rgba(118, 118, 128, 0.24);
      --fill-strong: rgba(120, 120, 128, 0.36);
      --thumb: #636366;
      --accent: #ff6189;
      --card-shadow: none;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; width: 320px; padding: 14px 12px 10px; background: var(--bg); color: var(--label);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header { display: flex; align-items: center; gap: 12px; padding: 0 4px 12px; }
  header img { width: 34px; height: 34px; filter: drop-shadow(0 3px 6px rgba(192, 31, 75, 0.28)); }
  h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin: 1px 0 0; font-size: 12.5px; color: var(--secondary); }

  .card { display: flow-root; margin-bottom: 8px; padding: 0 14px; border-radius: 14px; background: var(--card); box-shadow: var(--card-shadow); }
  .row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .row + .row, .caption + .row { border-top: 0.5px solid var(--separator); }
  .row .grow { flex: 1; }
  label.row, label.card { cursor: pointer; }

  .hero { display: flex; align-items: center; gap: 10px; min-height: 50px; }
  .hero .grow { flex: 1; min-width: 0; }
  .hero .title { display: block; font-size: 15px; font-weight: 600; }
  .hero .note { display: block; margin-top: 2px; font-size: 12px; color: var(--secondary); }
  .hero .note[hidden] { display: none; }
  .hero.unavailable { cursor: default; }
  .setup button {
    flex: none; padding: 7px 14px; border: 0; border-radius: 999px; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  [hidden] { display: none !important; }

  kbd {
    padding: 1px 6px; border-radius: 6px; background: var(--fill); color: var(--secondary);
    font-family: inherit; font-size: 11px; font-weight: 500; line-height: 1.5; white-space: nowrap;
    letter-spacing: 0; text-transform: none;
  }
  kbd:empty, .hero.unavailable kbd { display: none; }

  .section-label {
    display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 5px;
    font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--secondary);
  }

  /* iOS-style switch; the knob stretches while pressed */
  .switch {
    appearance: none; position: relative; flex: none; width: 46px; height: 28px; margin: 0;
    border-radius: 14px; background: var(--fill-strong); cursor: pointer; transition: background 0.25s;
  }
  .switch::before {
    content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 12px;
    background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16);
    transition: transform 0.3s cubic-bezier(0.3, 0.7, 0.4, 1), width 0.2s;
  }
  .switch:checked { background: var(--accent); }
  .switch:checked::before { transform: translateX(18px); }
  .switch:active::before { width: 28px; }
  .switch:checked:active::before { transform: translateX(14px); }
  .switch:disabled { opacity: 0.4; cursor: default; }

  /* Segmented control with a sliding thumb; --n is the number of options */
  .segmented {
    --n: 2; position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); margin: 12px 0 0;
    padding: 2px; border-radius: 10px; background: var(--fill);
  }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label {
    position: relative; z-index: 1; padding: 6px 0; border-radius: 8px; text-align: center;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: color 0.2s;
  }
  .segmented input:not(:checked) + label { color: var(--secondary); }
  .segmented .thumb {
    position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 8px;
    background: var(--thumb); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
    transition: transform 0.3s cubic-bezier(0.3, 0.7, 0.4, 1);
  }
  .segmented:has(input:nth-of-type(2):checked) .thumb { transform: translateX(100%); }
  .segmented:has(input:nth-of-type(3):checked) .thumb { transform: translateX(200%); }
  .segmented:has(input:nth-of-type(4):checked) .thumb { transform: translateX(300%); }
  .segmented.small { width: 196px; margin: 0; }
  .segmented.small label { padding: 3px 0; font-size: 12px; }
  .disabled { opacity: 0.4; pointer-events: none; }

  .preview { padding: 8px 4px 6px; font-size: 23px; line-height: 2.1; text-align: center; }
  .caption { margin: 8px 2px 10px; font-size: 12.5px; color: var(--secondary); text-align: center; }

  /* Size slider */
  .slider { display: flex; align-items: center; gap: 12px; padding: 0 0 10px; }
  .slider span { color: var(--secondary); line-height: 1; }
  .slider span:first-child { font-size: 12px; }
  .slider span:last-child { font-size: 19px; }
  input[type="range"] {
    --p: 33%; -webkit-appearance: none; appearance: none; flex: 1; height: 28px; margin: 0;
    background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--fill-strong) var(--p));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 7px rgba(0, 0, 0, 0.2), 0 0 0 0.5px rgba(0, 0, 0, 0.06); transition: transform 0.15s;
  }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.1); }
  output { font-variant-numeric: tabular-nums; color: var(--secondary); }

  .switch:focus-visible, input[type="range"]:focus-visible, .segmented input:focus-visible + label {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  footer { display: flex; justify-content: center; gap: 6px; padding: 4px 0 0; font-size: 11px; color: var(--secondary); }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--label); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <img src="../icons/48.png" alt="">
  <div>
    <h1>Ruby</h1>
    <p>Japanese, annotated</p>
  </div>
</header>

<div class="card hero setup" id="setup" hidden>
  <span class="grow">
    <span class="title">Finish setting up</span>
    <span class="note">Ruby starts once you agree</span>
  </span>
  <button id="setup-button">Review</button>
</div>

<label class="card hero" id="hero">
  <span class="grow">
    <span class="title">Show on this page</span>
    <span class="note" id="unavailable" hidden>Not available here · try reloading</span>
  </span>
  <kbd data-command="toggle"></kbd>
  <input type="checkbox" class="switch" id="on" role="switch" aria-label="Show on this page">
</label>

<div class="section-label"><span>Annotations</span><kbd data-command="furigana"></kbd></div>
<div class="card">
  <div class="segmented" role="radiogroup" aria-label="Annotations">
    <input type="radio" name="mode" id="mode-english" value="english"><label for="mode-english">English</label>
    <input type="radio" name="mode" id="mode-furigana" value="furigana"><label for="mode-furigana">Furigana</label>
    <span class="thumb" aria-hidden="true"></span>
  </div>
  <div class="preview" lang="ja" aria-hidden="true">
    <ruby class="jr"><ruby class="jf">日本語<rt data-t="にほんご"></rt></ruby><rt data-t="Japanese"></rt></ruby>を<ruby class="jr"><ruby class="jf">勉強<rt data-t="べんきょう"></rt></ruby>する<rt data-t="study"></rt></ruby>
  </div>
</div>

<div class="section-label"><span>Hover</span><kbd data-command="reveal"></kbd></div>
<div class="card">
  <div class="segmented" style="--n: 3" role="radiogroup" aria-label="Hover">
    <input type="radio" name="hover" id="hover-off" value="off"><label for="hover-off">Off</label>
    <input type="radio" name="hover" id="hover-swap" value="swap"><label for="hover-swap">Swap</label>
    <input type="radio" name="hover" id="hover-reveal" value="reveal"><label for="hover-reveal">Reveal</label>
    <span class="thumb" aria-hidden="true"></span>
  </div>
  <p class="caption" id="hover-caption"></p>
  <div class="row" id="hover-key-row">
    <span class="grow">Hold key</span>
    <div class="segmented small" style="--n: 4" role="radiogroup" aria-label="Only while holding this key">
      <input type="radio" name="hover-key" id="key-none" value=""><label for="key-none">None</label>
      <input type="radio" name="hover-key" id="key-shift" value="shift"><label for="key-shift">Shift</label>
      <input type="radio" name="hover-key" id="key-ctrl" value="ctrl"><label for="key-ctrl">Ctrl</label>
      <input type="radio" name="hover-key" id="key-alt" value="alt"><label for="key-alt">Alt</label>
      <span class="thumb" aria-hidden="true"></span>
    </div>
  </div>
</div>

<div class="card">
  <div class="row">
    <span class="grow">Text size</span>
    <output id="size-value"></output>
  </div>
  <label class="slider">
    <span>あ</span>
    <input type="range" id="size" min="40" max="100" step="5" aria-label="Text size">
    <span>あ</span>
  </label>
</div>

<footer>
  <a href="#" id="shortcuts">Keyboard shortcuts</a>
  <span>·</span>
  <a href="https://www.edrdg.org/edrdg/licence.html" target="_blank">JMdict © EDRDG, CC BY-SA 4.0</a>
</footer>
<script src="popup.js"></script>
</body>
</html>
