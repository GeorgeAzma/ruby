<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruby Reader</title>
<link rel="icon" href="../icons/32.png">
<link rel="stylesheet" href="content.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: #ffffff;
    --label: #1c1c1e;
    --secondary: rgba(60, 60, 67, 0.6);
    --tertiary: rgba(60, 60, 67, 0.3);
    --fill: rgba(118, 118, 128, 0.12);
    --thumb: #ffffff;
    --accent: #de2c5f;
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --label: #ffffff;
      --secondary: rgba(235, 235, 245, 0.6);
      --tertiary: rgba(235, 235, 245, 0.3);
      --fill: rgba(118, 118, 128, 0.24);
      --thumb: #636366;
      --accent: #ff6189;
      --card-shadow: none;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px 64px; background: var(--bg); color: var(--label);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 760px; margin: 0 auto; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 0 4px 20px; }
  header img { width: 40px; height: 40px; filter: drop-shadow(0 3px 6px rgba(192, 31, 75, 0.28)); }
  h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  header p { margin: 1px 0 0; font-size: 13px; color: var(--secondary); }
  header .grow { flex: 1; min-width: 200px; }

  .card { margin-bottom: 12px; border-radius: 16px; background: var(--card); box-shadow: var(--card-shadow); }

  /* Segmented control, as in the popup */
  .segmented {
    --n: 2; position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); width: 200px;
    padding: 2px; border-radius: 10px; background: var(--fill);
  }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label {
    position: relative; z-index: 1; padding: 5px 0; border-radius: 8px; text-align: center;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: color 0.2s;
  }
  .segmented input:not(:checked) + label { color: var(--secondary); }
  .segmented .thumb {
    position: absolute; top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 8px;
    background: var(--thumb); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
    transition: transform 0.3s cubic-bezier(0.3, 0.7, 0.4, 1);
  }
  .segmented:has(input:nth-of-type(2):checked) .thumb { transform: translateX(100%); }

  textarea {
    display: block; width: 100%; min-height: 110px; padding: 16px 18px 6px; border: 0; resize: none;
    background: transparent; color: inherit; font-family: inherit; font-size: 17px; line-height: 1.6; outline: none;
  }
  textarea::placeholder { color: var(--tertiary); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px 10px 18px; }
  .bar .grow { flex: 1; font-size: 12px; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .bar button {
    padding: 5px 12px; border: 0; border-radius: 999px; background: var(--fill); color: var(--secondary);
    font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.4; cursor: pointer; transition: color 0.2s;
  }
  .bar button:hover { color: var(--label); }
  .bar button:disabled { opacity: 0.4; cursor: default; }

  #result { padding: 18px 24px; font-size: 24px; line-height: 2.3; overflow-wrap: anywhere; }
  #result p { margin: 0; }
  #result p + p { margin-top: 0.8em; }
  #result .empty { padding: 28px 0; font-size: 14px; line-height: 1.4; color: var(--secondary); text-align: center; }


  .segmented input:focus-visible + label, .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="../icons/48.png" alt="">
    <div class="grow">
      <h1>Reader</h1>
      <p>Paste Japanese text from PDFs, apps or anywhere else</p>
    </div>
    <div class="segmented" role="radiogroup" aria-label="Annotations">
      <input type="radio" name="mode" id="mode-english" value="english"><label for="mode-english">English</label>
      <input type="radio" name="mode" id="mode-furigana" value="furigana"><label for="mode-furigana">Furigana</label>
      <span class="thumb" aria-hidden="true"></span>
    </div>
  </header>

  <div class="card">
    <textarea id="text" placeholder="Paste or type Japanese here" spellcheck="false" lang="ja" autofocus></textarea>
    <div class="bar">
      <span class="grow" id="count"></span>
      <button id="clear" disabled>Clear</button>
    </div>
  </div>

  <div class="card" id="result" lang="ja"></div>
</main>
<script src="reader.js"></script>
</body>
</html>
